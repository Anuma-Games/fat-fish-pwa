<section class="hero" id="inicio" data-seccion="inicio" [class.encendiendo]="encendiendo()">
  <!-- The swirling paint of the game's start menu, with the wheel at its eye (fondo-remolino.ts) -->
  <canvas class="lp-ambiente" #fondo aria-hidden="true"></canvas>
  <div class="penumbra" aria-hidden="true"></div>

  <!-- Lamp and its beam: they span the title and the table, so the light ends on the wheel -->
  <div class="luz" aria-hidden="true">
    <div class="lampara">
      <span class="cable"></span>
      <span class="pantalla"></span>
      <span class="foco"></span>
    </div>
    <div class="haz">
      @for (p of polvo; track $index) {
        <i
          [style.left.%]="p.x"
          [style.top.%]="p.y"
          [style.width.px]="p.tam"
          [style.height.px]="p.tam"
          [style.animation-delay.s]="p.retraso"
          [style.animation-duration.s]="p.duracion"
        ></i>
      }
    </div>
  </div>

  <div class="lp-wrap titulo">
    <span class="eyebrow lp-gold">{{ hero.eyebrow }}</span>
    <h1 class="crt">{{ hero.titulo }}</h1>
    <p class="claim">{{ hero.claim }}</p>
  </div>

  <button
    type="button"
    class="mesa"
    #mesa
    [class.girando]="girando()"
    aria-label="Girar la ruleta"
    [attr.aria-disabled]="girando()"
    (click)="alClic()"
    (pointerdown)="arrastreInicio($event)"
    (pointerup)="arrastreFin($event)"
  >
    <!-- Chips dragged by the swirl, spiralling into the wheel on the plane of the table -->
    <div class="lp-arrastre" aria-hidden="true">
      @for (f of arrastradas; track $index) {
        <span
          [style.--vuelta.s]="f.vuelta"
          [style.--caida.s]="f.caida"
          [style.--retraso.s]="f.retraso"
          [style.--desfase.s]="f.desfase"
        >
          <i
            [style.--ficha]="'url(img/landing/fichas/' + f.ficha + '.png)'"
            [style.--tam.px]="f.tam"
          ></i>
        </span>
      }
    </div>
    <!-- The Crupier of the game, on the other side of the wheel (sprites from scripts/sprites-hero.py) -->
    <span class="crupier" aria-hidden="true">
      <img src="img/landing/hero/crupier-traje.png" alt="" />
      <img class="bolsa" src="img/landing/hero/crupier-bolsa.png" alt="" />
    </span>
    <div class="plano" #plano>
      <!-- Bowl and ball track: they do not turn -->
      <img class="cuenco" src="img/landing/hero/ruleta-cuenco.png" alt="" />

      <!-- Wheel head: pockets, numbers, cone and turret. It turns. -->
      <div class="giro-lento">
        <div class="giro-jugado">
          <div class="cabeza">
            <img class="rueda" src="img/landing/hero/ruleta-cabeza.png" alt="" />
            <!-- Numbers on a layer of twice the resolution, so they stay crisp as the head turns -->
            <img class="rueda" src="img/landing/hero/ruleta-numeros.png" alt="" />
            <!-- The ball lives in the frame of the wheel head: it runs the other way and lands in a pocket -->
            <div class="orbita"><span class="bola"></span></div>
          </div>
        </div>
      </div>

      <!-- Center cap with the badge: it stays upright while the wheel turns around it -->
      <img class="tapa" src="img/landing/hero/ruleta-tapa.png" alt="" />

      <!-- Still light over the turning wheel, and the swirl shining on the lacquered rim -->
      <span class="brillo"></span>
      <span class="lp-reflejo"></span>
    </div>
    <span class="sombra"></span>
  </button>

  <div class="lp-wrap pie">
    <p class="resultado" aria-live="polite">
      @if (girando()) {
        La bola corre…
      } @else if (resultado(); as r) {
        Salió el <strong>{{ r.numero }}</strong
        >, {{ r.color }}.
      } @else {
        {{ ruleta.pista }}
      }
    </p>
    <p class="lead">{{ hero.texto }}</p>
    <div class="actions">
      <a class="btn" appIman [href]="cta.demo">Jugar la demo</a>
      <a class="btn lp-alt" appIman [routerLink]="cta.expediente">Ver un expediente</a>
    </div>
  </div>

  <a class="scroll-hint" href="#como-se-juega" aria-label="Bajar a cómo se juega">
    <span class="eyebrow">Cómo se juega</span>
    <span class="flecha" aria-hidden="true"></span>
  </a>
</section>
