<button
  #boton
  class="hamburguesa"
  type="button"
  aria-label="Abrir el menú"
  aria-controls="lp-menu"
  [attr.aria-expanded]="abierto()"
  (click)="abrir()"
>
  <app-pixel-icon name="menu" [size]="20" />
</button>

<div class="velo" [class.abierto]="abierto()" (click)="cerrar()" aria-hidden="true"></div>

<aside
  id="lp-menu"
  class="panel"
  [class.abierto]="abierto()"
  [attr.inert]="abierto() ? null : ''"
  aria-label="Menú"
  (keydown.tab)="atrapar($event)"
  (keydown.shift.tab)="atrapar($event)"
>
  <div class="cabecera">
    <img src="icons/insignia-96.png" alt="" width="36" height="36" />
    <span class="marca">Fat Fish</span>
    <button
      #cerrarBoton
      class="cerrar"
      type="button"
      aria-label="Cerrar el menú"
      (click)="cerrar()"
    >
      <app-pixel-icon name="cerrar" [size]="18" />
    </button>
  </div>

  <span class="grupo">{{ menu.mesa.titulo }}</span>
  <nav class="enlaces" [attr.aria-label]="menu.mesa.titulo" (click)="cerrar()">
    @for (e of menu.mesa.enlaces; track e.id) {
      <a [href]="'#' + e.id"><app-pixel-icon [name]="e.icono" [size]="16" /> {{ e.texto }}</a>
    }
  </nav>

  <span class="grupo">{{ menu.app.titulo }}</span>
  <nav class="enlaces" [attr.aria-label]="menu.app.titulo" (click)="cerrar()">
    @for (e of menu.app.enlaces; track e.ruta) {
      <a [routerLink]="e.ruta"><app-pixel-icon [name]="e.icono" [size]="16" /> {{ e.texto }}</a>
    }
  </nav>

  <div class="pie">
    <button
      class="sonido"
      type="button"
      [attr.aria-pressed]="sonido.activo()"
      (click)="sonido.alternar()"
    >
      Sonido de la mesa: {{ sonido.activo() ? 'sí' : 'no' }}
    </button>
    <a class="btn" [href]="cta.demo" (click)="cerrar()">Jugar la demo</a>
  </div>
</aside>
