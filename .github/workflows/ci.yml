name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  artifact-policy:
    name: Verificar conservación de builds
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Pruebas de limpieza y publicación
        working-directory: .github/scripts
        run: python3 -m unittest test_prune_artifacts test_publish_latest_build

  check:
    name: Analizar y probar
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Node 24 con caché de npm
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar formato
        run: npm run format:check

      - name: Pruebas
        run: npx ng test --watch=false

      - name: Pruebas del Service Worker
        run: npm run test:sw

  build:
    name: Compilar
    needs: check
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Node 24 con caché de npm
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar (producción)
        run: npx ng build

      - name: Subir artefacto (build)
        uses: actions/upload-artifact@v7
        with:
          name: fat-fish-pwa-dist
          retention-days: 7
          path: dist/
          if-no-files-found: error

  docker:
    name: Construir imagen Docker
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Validates the multi-stage Dockerfile; the image is not published yet
      - name: Construir imagen
        run: docker build --tag fat-fish-pwa:${{ github.sha }} .

      - name: Resumen de la imagen
        run: |
          {
            echo "## Imagen Docker"
            echo
            echo "| Imagen | Tamaño |"
            echo "|---|---|"
            docker image ls fat-fish-pwa:${{ github.sha }} --format '| `{{.Repository}}:{{.Tag}}` | {{.Size}} |'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Actualizar última descarga
    needs: [build, docker, artifact-policy]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Descargar el build comprobado de esta ejecución
        uses: actions/download-artifact@v8
        with:
          name: fat-fish-pwa-dist
          path: release-input

      - name: Publicar y reemplazar la descarga anterior
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/publish_latest_build.py --source release-input --name fat-fish-pwa.zip --zip
