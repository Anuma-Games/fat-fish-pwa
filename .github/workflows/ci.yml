name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Analizar y probar
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Node 24 con caché de npm
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar formato
        run: npm run format:check

      - name: Pruebas
        run: npx ng test --watch=false

  build:
    name: Compilar
    needs: check
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Node 24 con caché de npm
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar (producción)
        run: npx ng build

      - name: Subir artefacto (build)
        uses: actions/upload-artifact@v7
        with:
          name: fat-fish-pwa-dist
          path: dist/
          if-no-files-found: error

  docker:
    name: Construir imagen Docker
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Validates the multi-stage Dockerfile; the image is not published yet
      - name: Construir imagen
        run: docker build --tag fat-fish-pwa:${{ github.sha }} .

      - name: Resumen de la imagen
        run: |
          {
            echo "## Imagen Docker"
            echo
            echo "| Imagen | Tamaño |"
            echo "|---|---|"
            docker image ls fat-fish-pwa:${{ github.sha }} --format '| `{{.Repository}}:{{.Tag}}` | {{.Size}} |'
          } >> "$GITHUB_STEP_SUMMARY"
