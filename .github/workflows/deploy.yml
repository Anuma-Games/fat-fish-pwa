name: Deploy

# main publica en producción (canal "live").
# La rama de pruebas de FF-73 publica en un canal de vista previa y NO toca el sitio público.
on:
  push:
    branches:
      - main
      - feature/FF-73-Publicar-la-PWA-en-Firebase-Hosting
  # Permite lanzarlo a mano desde la pestaña Actions
  workflow_dispatch:

permissions:
  contents: read

# Un solo despliegue a la vez; si llega otro, espera a que termine el actual
concurrency:
  group: deploy-firebase
  cancel-in-progress: false

jobs:
  deploy:
    name: Compilar y publicar en Firebase Hosting
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Node 24 con caché de npm
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Genera dist/Pwa_FatFish/browser, la carpeta "public" de firebase.json
      - name: Compilar (producción)
        run: npx ng build

      # main -> live (sitio público). Cualquier otra rama -> canal de vista previa "prueba-ff73" (dura 7 días)
      - name: Publicar en Firebase Hosting
        id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: fat-fish-511723
          channelId: ${{ github.ref == 'refs/heads/main' && 'live' || 'prueba-ff73' }}

      - name: Resumen del despliegue
        if: success()
        run: |
          {
            echo "## Despliegue en Firebase Hosting"
            echo
            echo "- Rama: \`${{ github.ref_name }}\`"
            echo "- URL: ${{ steps.deploy.outputs.details_url }}"
            echo "- Expira: ${{ steps.deploy.outputs.expire_time_formatted }}"
          } >> "$GITHUB_STEP_SUMMARY"